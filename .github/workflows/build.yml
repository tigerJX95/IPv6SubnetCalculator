name: Build missing Release EXE

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.event.release.id || github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Check Release EXE attachments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decision.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Decide whether an EXE is needed
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo 'Manual build: output stays in Actions; no Release is changed.' >> "$GITHUB_STEP_SUMMARY"
          else
            python3 tools/release_assets.py inspect --release-id "$RELEASE_ID" --tag "$RELEASE_TAG"
          fi

  build:
    name: Build and verify Windows x64 EXE
    needs: inspect
    if: needs.inspect.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify Release tag and main history
        if: github.event_name == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/release_assets.py history --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release version or main history validation failed.' }
      - name: Install locked application and check dependencies
        run: python -m pip install -r requirements.txt -r requirements-ci.txt pyinstaller==6.22.3
      - name: Build single-file EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/build_manifest.py
          if ($LASTEXITCODE -ne 0) { throw 'Resource checks failed.' }
          $version = python tools/release_assets.py version
          if ($LASTEXITCODE -ne 0) { throw 'Invalid application version.' }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "IPv6SubnetCalculator_V$version" --icon app.ico --add-data 'build_manifest.json;.' --add-data 'app.ico;.' --add-data 'assets;assets' --add-data 'LICENSE;.' --add-data 'NOTICE;.' --add-data 'THIRD_PARTY_NOTICES.md;.' --add-data 'docs/licenses;docs/licenses' --add-data 'docs/about;docs/about' --copy-metadata PyQt6 --copy-metadata PyQt6-Qt6 --copy-metadata PyQt6-sip --exclude-module tkinter --exclude-module PyQt5 --exclude-module PySide2 --exclude-module PySide6 main.py
          if ($LASTEXITCODE -ne 0) { throw 'EXE build failed.' }
      - name: Verify security, regressions, source and packaged EXE
        shell: pwsh
        run: |
          $version = python tools/release_assets.py version
          if ($LASTEXITCODE -ne 0) { throw 'Invalid application version.' }
          python tools/verify.py --report-dir verification/release --exe "dist/IPv6SubnetCalculator_V$version.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Release verification failed.' }
      - name: Validate output and record SHA-256
        id: output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python tools/release_assets.py version
          if ($LASTEXITCODE -ne 0) { throw 'Invalid application version.' }
          $filename = "IPv6SubnetCalculator_V$version.exe"
          $file = Get-Item -LiteralPath "dist/$filename"
          if ($file.Length -le 0) { throw 'Empty EXE output.' }
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "${hash}  $filename" >> $env:GITHUB_STEP_SUMMARY
          "filename=$filename" >> $env:GITHUB_OUTPUT
      - name: Upload single EXE without ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: dist/${{ steps.output.outputs.filename }}
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Recheck and attach generated EXE
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXE_NAME: ${{ steps.output.outputs.filename }}
        run: |
          python tools/release_assets.py publish --release-id "$env:RELEASE_ID" --tag "$env:RELEASE_TAG" --package "dist/$env:EXE_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'EXE attachment failed; existing files were not replaced.' }
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-release-verification
          path: verification/release/
          if-no-files-found: warn
          retention-days: 7
